<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAT Thermodynamics Quiz — Second Session 2024</title>
<style>
  :root{
    --cold:#1e3a5f;
    --cold2:#2f5d8a;
    --mid:#c96a3c;
    --hot:#e0472b;
    --hot2:#f2825a;
    --ink:#1b1a17;
    --paper:#f6f1e6;
    --paper2:#eee6d4;
    --line:#d8cdb3;
    --good:#2f7d5a;
    --bad:#b0392c;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Iowan Old Style','Georgia','Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(224,71,43,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(47,93,138,0.10), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    padding:36px 18px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Header */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:18px;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .kicker{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--hot);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(26px,4.2vw,38px);
    margin:0;
    line-height:1.05;
    letter-spacing:-0.01em;
  }
  h1 em{font-style:italic; color:var(--cold2);}
  .meta{
    font-family:var(--mono);
    font-size:11.5px;
    color:#6b6455;
    text-align:right;
    line-height:1.6;
  }

  /* Thermometer progress */
  .therm-row{
    display:flex; align-items:center; gap:14px;
    margin:22px 0 30px;
  }
  .therm-track{
    flex:1;
    height:14px;
    background:var(--paper2);
    border:1px solid var(--line);
    border-radius:8px;
    position:relative;
    overflow:hidden;
  }
  .therm-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--cold2),var(--mid) 55%,var(--hot));
    transition:width .5s cubic-bezier(.4,0,.2,1);
    border-radius:8px;
  }
  .therm-label{
    font-family:var(--mono);
    font-size:12px;
    white-space:nowrap;
    color:#54503f;
    min-width:74px;
    text-align:right;
  }

  /* Score readout */
  .score-strip{
    display:none;
    font-family:var(--mono);
    font-size:12px;
    color:#54503f;
    letter-spacing:.03em;
    margin:-16px 0 26px;
    display:none;
  }
  .score-strip.show{display:block;}
  .score-strip b{color:var(--ink);}

  /* Question card */
  .card{
    background:#fffdf8;
    border:1px solid var(--line);
    border-left:4px solid var(--cold2);
    border-radius:2px;
    padding:26px 28px 24px;
    margin-bottom:22px;
    box-shadow:0 1px 0 rgba(0,0,0,0.02);
    transition:border-color .25s ease;
  }
  .card.answered.correct{border-left-color:var(--good);}
  .card.answered.wrong{border-left-color:var(--bad);}

  .qnum{
    font-family:var(--mono);
    font-size:11px;
    color:var(--hot);
    letter-spacing:.08em;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  .qnum span.tag{color:#9a9280;}

  .qtext{
    font-size:17px;
    line-height:1.5;
    margin:0 0 18px;
    color:var(--ink);
  }

  .options{list-style:none; margin:0; padding:0; display:grid; gap:9px;}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    cursor:pointer;
    font-size:15px;
    line-height:1.4;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .opt:hover{border-color:var(--cold2); background:#f1ece0;}
  .opt .letter{
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    color:#8a8370;
    border:1px solid #c9c0a7;
    border-radius:50%;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    margin-top:1px;
    background:#fffdf8;
  }

  .card.locked .opt{cursor:default;}
  .card.locked .opt:hover{background:var(--paper); border-color:var(--line);}

  .opt.chosen-correct{background:#e8f3ec; border-color:var(--good);}
  .opt.chosen-correct .letter{background:var(--good); border-color:var(--good); color:#fff;}
  .opt.chosen-wrong{background:#fbeae7; border-color:var(--bad);}
  .opt.chosen-wrong .letter{background:var(--bad); border-color:var(--bad); color:#fff;}
  .opt.reveal-correct{background:#e8f3ec; border-color:var(--good);}
  .opt.reveal-correct .letter{background:var(--good); border-color:var(--good); color:#fff;}
  .opt.dim{opacity:.55;}

  .feedback{
    margin-top:14px;
    font-family:var(--mono);
    font-size:12.5px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .card.answered .feedback{display:block;}
  .feedback .verdict{font-weight:700; letter-spacing:.03em;}
  .feedback .verdict.good{color:var(--good);}
  .feedback .verdict.bad{color:var(--bad);}

  /* Final panel */
  .final{
    display:none;
    text-align:center;
    padding:40px 24px;
    border:2px solid var(--ink);
    background:#fffdf8;
    margin-top:10px;
  }
  .final.show{display:block;}
  .final .big{
    font-family:var(--serif);
    font-size:52px;
    font-weight:600;
    letter-spacing:-0.02em;
  }
  .final .sub{
    font-family:var(--mono);
    font-size:12px;
    color:#6b6455;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-top:6px;
  }
  .final button{
    margin-top:22px;
  }

  button.reset{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:11px 22px;
    border-radius:3px;
    cursor:pointer;
  }
  button.reset:hover{background:#3a3628;}

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:10.5px;
    color:#a49c86;
    margin-top:40px;
    letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    .therm-fill{transition:none;}
  }

  @media (max-width:520px){
    .card{padding:20px 16px;}
    header{flex-direction:column; align-items:flex-start;}
    .meta{text-align:left;}
  }

  :focus-visible{outline:2px solid var(--cold2); outline-offset:2px;}
</style>
</head>

<div class="wrap">

  <header>
    <div>
      <p class="kicker">IMAT Physics · Second Session 2024</p>

</div>

    qtext.className = 'qtext';
    qtext.textContent = item.q;
    card.appendChild(qtext);

    const ul = document.createElement('ul');
    ul.className = 'options';

    item.options.forEach((optText, oi) => {
      const li = document.createElement('li');
      li.className = 'opt';
      li.dataset.index = oi;
      li.innerHTML = `<span class="letter">${LETTERS[oi]}</span><span>${optText}</span>`;
      li.addEventListener('click', () => selectAnswer(qi, oi));
      ul.appendChild(li);
    });

    card.appendChild(ul);

    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = 'fb-' + qi;
    card.appendChild(fb);

    quizEl.appendChild(card);
  });
  updateProgress();
}

function selectAnswer(qi, oi){
  if(answered[qi] !== null) return; // locked
  answered[qi] = oi;

  const card = document.getElementById('card-' + qi);
  const opts = card.querySelectorAll('.opt');
  const correctIdx = DATA[qi].correct;
  const isCorrect = oi === correctIdx;

  card.classList.add('answered', 'locked', isCorrect ? 'correct' : 'wrong');

  opts.forEach((el, idx) => {
    if(idx === oi && idx === correctIdx){
      el.classList.add('chosen-correct');
    } else if(idx === oi && idx !== correctIdx){
      el.classList.add('chosen-wrong');
    } else if(idx === correctIdx){
      el.classList.add('reveal-correct');
    } else {
      el.classList.add('dim');
    }
  });

  const fb = document.getElementById('fb-' + qi);
  if(isCorrect){
    fb.innerHTML = `<span class="verdict good">Correct.</span> ${LETTERS[correctIdx]} — ${DATA[qi].options[correctIdx]}`;
  } else {
    fb.innerHTML = `<span class="verdict bad">Not quite.</span> Correct answer: ${LETTERS[correctIdx]} — ${DATA[qi].options[correctIdx]}`;
  }

  updateProgress();
}

function updateProgress(){
  const total = DATA.length;
  const done = answered.filter(a => a !== null).length;
  const correct = answered.filter((a, i) => a === DATA[i].correct).length;

  const pct = (done / total) * 100;
  thermFill.style.width = pct + '%';
  thermLabel.textContent = `${done} / ${total}`;

  if(done > 0){
    scoreStrip.classList.add('show');
    scoreStrip.innerHTML = `Score so far: <b>${correct} / ${done}</b> correct (${Math.round(correct/done*100)}%)`;
  } else {
    scoreStrip.classList.remove('show');
  }

  if(done === total){
    finalPanel.classList.add('show');
    finalScore.textContent = `${correct} / ${total}`;
    const pctFinal = Math.round(correct/total*100);
    let note = 'recalibrate and try again';
    if(pctFinal >= 90) note = 'thermal equilibrium reached — excellent';
    else if(pctFinal >= 70) note = 'solid — a few concepts to revisit';
    else if(pctFinal >= 50) note = 'halfway to steady state — keep reviewing';
    else note = 'back to the gas laws before the next attempt';
    finalNote.textContent = note;
    finalPanel.scrollIntoView({behavior:'smooth', block:'nearest'});
  } else {
    finalPanel.classList.remove('show');
  }
}

function shuffleArr(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function reshuffleData(){
  DATA.forEach(item => {
    const correctText = item.options[item.correct];
    shuffleArr(item.options);
    item.correct = item.options.indexOf(correctText);
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  answered = new Array(DATA.length).fill(null);
  reshuffleData();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

render();
</script>
</body>
</html>
